# squid.conf - minimal version for NGINX → Squid → Webshare rotating gateway

# Listening port - NGINX will connect here
http_port 127.0.0.1:3128

# Very important: forward ALL traffic through Webshare
# no direct connections allowed
never_direct allow all

# Webshare rotating endpoint as parent proxy
# port 80 is correct for HTTP gateway (most common for Webshare)
cache_peer sock-host.com parent 80 0 \
    no-query \
    default \
    login=username:password

# Optional but recommended - name the peer for clarity/logging
# name=webshare
# Hide client IP and proxy traces
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all

# Allow only local access (NGINX runs on same machine)
acl localnet src 127.0.0.1/32
http_access allow localnet
http_access deny all

# Logging (very useful for debugging)
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
