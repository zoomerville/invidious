# put the following in the http context (top of file)
map $request_method $limit_key {
    default $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/m;


limit_req_zone $limit_key zone=login_zone:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

proxy_cache_path /var/cache/nginx/api_cache levels=1:2
                 keys_zone=api_cache:10m
                 max_size=50m
                 inactive=5m
                 use_temp_path=off;

map $uri $api_host {
	~^/api/skipsegments   sponsor.ajay.app;
	~^/api/dislikes       returnyoutubedislikeapi.com;
	default               "";
}

map $uri $api_path {
	~^/api/skipsegments   /api/skipsegments;
	~^/api/dislikes       /votes;
	default               "";
}


# 3000 = anubis
# 5555 = invidious
# 8282 = companion
upstream app { server 127.0.0.1:3000; }
upstream raw { server 127.0.0.1:5555; }

upstream serve { server 127.0.0.1:8282; }
upstream login { server 127.0.0.1:3000; }


server {
    listen 443 ssl;
    http2 on;
    #listen [::]:443 ssl http2;
    listen 443 quic reuseport;
    #listen [::]:443 quic reuseport;

    server_name inv.zoomerville.com;

    http3 on;
    ssl_early_data on;
    add_header Alt-Svc 'h3=":443"; ma=86400';
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_buffers 16 8k;
    gzip_min_length 256;
    gzip_disable "msie6";
    ssl_certificate /etc/letsencrypt/live/zoomerville.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zoomerville.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # global per-client connection cap for this server
    limit_conn addr 10;


    # shared proxy headers / websocket support / timeouts
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_redirect off;
    proxy_buffering off;    
    location = /robots.txt {
        root /var/www/html;       # nginx will look for /var/www/html/robots.txt
        try_files /robots.txt =404;
        default_type text/plain;
        expires 1h;
        access_log off;
        log_not_found off;
    }


    # 429 handling
    #limit_req_status 429;
    #error_page 429 /rate_limited.html;
    #location = /rate_limited.html { internal; root /var/www/html; }


    location /serve/ {
        proxy_pass http://serve/; # trailing slash strips /serve/ prefix
    }

    location /api/v1/stats {
        proxy_pass http://raw;
    }
    limit_req_status 429;
    error_page 429 /rate_limited.html;
    location = /rate_limited.html { internal; root /var/www/html; }


    location ^~ /login {
        limit_req zone=login_zone burst=30 nodelay;
        proxy_pass http://login;

    }

    location /feed/popular/ {
        add_header X-Robots-Tag "index" always;
        proxy_pass http://app;
    }

    location / {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://app;
    }

	location ~ ^/api/(skipsegments|dislikes) {
		# ==================== RATE LIMITING ====================
		limit_req zone=api_rate burst=5 nodelay;

		# ==================== CACHING ====================
		proxy_cache api_cache;
		proxy_cache_valid 200 302 404 1h;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		proxy_cache_bypass $http_cache_control;
		proxy_cache_lock on;
		proxy_cache_min_uses 1;

		# ==================== TUNNEL THROUGH SQUID → WEBSHARE ====================
		set $full_target https://$api_host$api_path;   # ← remove $is_args$args
		rewrite ^ $full_target break;
		
		proxy_pass http://127.0.0.1:3128;

		proxy_set_header Host $api_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# ←←← FULL BROWSER HEADERS TO BYPASS CLOUDFLARE 404 ←←←
		proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36";
		proxy_set_header Accept "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8";
		proxy_set_header Accept-Language "en-US,en;q=0.9";
		proxy_set_header Accept-Encoding "gzip, deflate, br";
		proxy_set_header DNT "1";
		proxy_set_header Upgrade-Insecure-Requests "1";

		proxy_http_version 1.1;
		proxy_set_header Connection "";

		# Only allow GET
		limit_except GET {
			deny all;
		}
	}

}

server {
    listen 80;
    server_name zoomerville.com inv.zoomerville.com;

    location / {
        return 301 https://$host$request_uri;
    }
}
